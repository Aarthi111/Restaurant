<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rate Your Order — Divya</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <button onclick="skip()" style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--text);">←</button>
    <span class="topbar-title">Rate Your Order</span>
    <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()">☾</button>
  </div>

  <div class="page" style="padding-top:16px;">
    <p style="font-size:14px;color:var(--text-muted);margin-bottom:20px;">How was each dish? Your feedback helps others.</p>
    <div id="review-list"><div class="loading">Loading...</div></div>
    <div id="submit-area" style="display:none;">
      <button class="btn btn-primary" id="submit-btn" onclick="submitAll()">Submit Reviews</button>
      <div style="margin-top:12px;"><button class="btn btn-outline" onclick="skip()">Skip</button></div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    requireAuth();
    const params = new URLSearchParams(window.location.search);
    const order_id = parseInt(params.get('order_id'));
    if (!order_id) { window.location.href = '/menu'; }

    let orderItems = [];
    const ratings = {};

    apiFetch('/orders/' + order_id).then(data => {
      orderItems = data.items;
      renderItems(data.items);
      document.getElementById('submit-area').style.display = 'block';
    }).catch(() => {
      document.getElementById('review-list').innerHTML = '<div class="loading">Could not load order.</div>';
    });

    function renderItems(items) {
      document.getElementById('review-list').innerHTML = items.map(item => `
        <div class="review-item" id="review-item-${item.menu_item_id}">
          <div class="review-item-name">${item.name}</div>
          <div class="star-row" id="stars-${item.menu_item_id}">
            ${[1,2,3,4,5].map(s =>
              `<button class="star" onclick="setStars(${item.menu_item_id},${s})">★</button>`
            ).join('')}
          </div>
          <textarea id="comment-${item.menu_item_id}" rows="2" placeholder="Write a comment (optional)"></textarea>
        </div>`).join('');
      items.forEach(item => { ratings[item.menu_item_id] = { stars: 0 }; });
    }

    function setStars(itemId, stars) {
      ratings[itemId] = { stars };
      document.querySelectorAll(`#stars-${itemId} .star`).forEach((btn, i) => {
        btn.classList.toggle('active', i < stars);
      });
    }

    async function submitAll() {
      const btn = document.getElementById('submit-btn');
      const toSubmit = orderItems.filter(item => ratings[item.menu_item_id]?.stars > 0);
      if (toSubmit.length === 0) { alert('Please rate at least one item.'); return; }
      btn.disabled = true; btn.textContent = 'Submitting...';

      let submitted = 0;
      for (const item of toSubmit) {
        const r = ratings[item.menu_item_id];
        const comment = document.getElementById('comment-' + item.menu_item_id)?.value.trim();
        try {
          await apiFetch('/reviews', {
            method: 'POST',
            body: JSON.stringify({ menu_item_id: item.menu_item_id, order_id, stars: r.stars, comment: comment || null })
          });
          submitted++;
          const card = document.getElementById('review-item-' + item.menu_item_id);
          if (card) card.style.opacity = '0.5';
        } catch (e) { console.error(e); }
      }
      btn.textContent = `${submitted} review${submitted!==1?'s':''} submitted!`;
      setTimeout(() => { window.location.href = '/menu'; }, 1500);
    }

    function skip() { window.location.href = '/menu'; }
  </script>
</body>
</html>
